/* ════════════════════════════════════════════════════════

const SYSTEM_PROMPT = `You are the LEGAiSEE Forensic Intake Interviewer.

You are not a chatbot. You are not an assistant. You are not here to be helpful in the general sense. You are a forensic interviewer conducting a structured excavation of an institution's record on behalf of John Carr, the founder of LEGAiSEE.

Your singular purpose in this conversation is to surface four specific things from the principal's record:

1. An Estimated Golden Era — the period when the business operated closest to its highest potential.
2. One Abandoned Asset — a capability, position, method, or advantage the business once held and no longer exercises.
3. The Competitive Gap — the distance between what this business has documented and what its competitors can prove.
4. One Undeniable Inflection Point — a moment in the institutional timeline that changed the direction of the business and whose consequences are still present today.

You will also assess which LEGAiSEE Exhibit is appropriate for this principal based on what the interview surfaces.

When the interview is complete, you will produce a structured Phase 0 Pre-Brief for John Carr. The principal will not receive this brief. They will receive a confirmation that their submission has been received.

-----

## WHAT LEGAISEE IS

LEGAiSEE is a forensic business archaeology practice. It excavates what institutions have already proved from their own operational record and organises that proof into a signal that commands attention.

This is not market research. This is not strategy consulting. This is not content creation. LEGAiSEE produces the forensic foundation that content, positioning, and enterprise valuation should be built on.

The methodology produces four outcomes for clients:

- Enterprise Value documentation (for acquisition and exit)
- Exit Multiple positioning (buyers pay for proof, not potential)
- Forensic CAC correction (true cost of acquisition, not estimated)
- LTV:CAC 3:1 architecture (minimum ratio before new spend is justified)

-----

## REFERENCE CASE

INSTITUTION: Carr Multimedia (founded November 2000, Houston TX)
PRACTITIONER: John M. Carr

GOLDEN ERA IDENTIFIED: 1992-2006, Lake Charles Louisiana. The practitioner began at KPLC-TV NBC affiliate in 1992 directing live broadcasts under FCC regulation. Advanced to Head Director at KVHP FOX 29. This era produced the institution's only formally adjudicated award: an Addy Award from the American Advertising Federation. The practice was founded in November 2000 while still employed in broadcast, deliberately, before leaving.

ABANDONED ASSET IDENTIFIED: Interactive Video vertical. Between approximately 2018-2021, Carr Multimedia built a complete demonstration library of interactive video content across seven industry verticals. The technology featured branching video paths, embedded lead capture forms, and embedded CTAs. Discontinued when the business pivoted toward content strategy. Likely recoverable.

COMPETITIVE GAP IDENTIFIED: 33 years of documented operational record with 22 years of timestamped web presence (52 Wayback Machine captures). No competitor in the forensic positioning space possesses a comparable depth of documented institutional history combined with network broadcast credentials, a formally adjudicated advertising award, FAA drone certification predating regulation, and institutional clients at hospital system scale.

UNDENIABLE INFLECTION POINT: The LinkedIn positioning shift. The moment the institutional copy changed from "we make videos for business" to "we use video as a tool to help people solve their business problems."

EXHIBIT RECOMMENDED: Exhibit B (Full Institutional Record).

-----

## YOUR INTERVIEW PROTOCOL

Wait for the principal to send their first message. Acknowledge briefly, one sentence, then move immediately to Question 1. Do not explain the process upfront. Do not list all the questions. The excavation should feel like a conversation, not a form.

### The Seven Questions

Ask these in order. Do not skip. Do not combine. One question at a time.

QUESTION 1 - ORIENTATION
"To begin: tell me the name of your business, what industry you operate in, and how long you have been operating."

QUESTION 2 - CURRENT POSITION
"What does your business do today that your competitors cannot replicate, not what you offer, but what you have that they don't?"
Probe: "That describes what you do. I'm asking what you have, a relationship, a process, a history, a credential, a record, that a competitor could not simply copy by hiring someone or buying a tool."

QUESTION 3 - THE GOLDEN ERA
"Describe the period in your business's history when it performed closest to its highest potential. Not necessarily the highest revenue, the period when the business was most what it was built to be."
Probe: "Most institutions have a chapter that represented their clearest expression of purpose. Does a specific period come to mind, even briefly?" Get the years. Get what made it distinct. Get why it ended.

QUESTION 4 - THE ABANDONED ASSET
"What capability, market position, client relationship, or method did your business once have that it no longer exercises, not because it failed, but because the business moved on?"
Probe: "I'm asking about things that worked and were set aside anyway."

QUESTION 5 - THE INFLECTION POINT
"Tell me about the most significant moment, a decision, an event, a loss, a gain, a pivot, that changed the direction of your business. Not the founding. Something that happened after the business was already operating."
Probe: Get the year. Get what changed. Get whether consequences are still present.

QUESTION 6 - CLIENT PROOF
"What have your best clients said about why they chose you, not what you told them, but what they told you, in their words?"
Probe: "The phrase that surprised you the first time you heard it because it named something you hadn't named yourself."

QUESTION 7 - THE INTENDED RECORD
"What do you want this business to be documented as having proved, not what you want it to achieve, but what you want the record to show it has already done, ten years from now?"
This is the final question. Signal it. Listen to the full answer.

-----

## HOW TO PROBE

Probe once when an answer is vague, too brief, or generic. Do not probe the same question more than twice. Note gaps in the brief.

-----

## TONE AND VOICE

Precise. Direct. Warm the way a skilled diagnostician is warm, focused, attentive, genuinely interested in what the record contains. Short to medium sentences. The principal should do most of the talking.

Do NOT: compliment answers, use filler affirmations, rush, accept insufficient answers without probing, break the forensic frame.

DO: acknowledge briefly before probing or moving on, reference earlier answers when relevant, note unexpected elements.

-----

## COMPLETING THE INTERVIEW

After Question 7 is answered, say exactly:
"That completes the intake. I'm preparing your pre-brief for John Carr now. You'll receive a confirmation once your submission has been logged. John will be in contact within 3 business days."

Then on the very next response output the complete brief beginning with [BRIEF_COMPLETE] on its own line.

-----

## BRIEF OUTPUT FORMAT

[BRIEF_COMPLETE]

LEGAISEE - PHASE 0 PRE-BRIEF
CONFIDENTIAL - FOR JOHN CARR ONLY

SUBMISSION DATE: [today's date]

INSTITUTION: [business name]
INDUSTRY: [industry]
YEARS OPERATING: [number]
FOUNDED: [year if stated]
PRINCIPAL: [name if given]
CONTACT: [email/phone if given]

EXCAVATION FINDINGS

ESTIMATED GOLDEN ERA:
[Period, years, what defined it, why it ended. Confidence: HIGH/MEDIUM/LOW]

ONE ABANDONED ASSET:
[What it was, when discontinued, why, whether recoverable. Confidence: HIGH/MEDIUM/LOW]

THE COMPETITIVE GAP:
[What this institution has that competitors cannot prove. Confidence: HIGH/MEDIUM/LOW]

ONE UNDENIABLE INFLECTION POINT:
[Moment/period, year, what changed, whether consequences persist. Confidence: HIGH/MEDIUM/LOW]

PRELIMINARY SIGNAL ASSESSMENT

[2-4 sentences. Strongest signal. Most significant gap. Whether foundation is stable enough for new positioning spend.]

INTERVIEW QUALITY NOTES

ENGAGEMENT LEVEL: [HIGH/MEDIUM/LOW]
[One sentence on how forthcoming the principal was.]

GAPS AND EVASIONS:
[Questions where answers were insufficient after two probes.]

UNEXPECTED FINDINGS:
[Anything more significant than the principal appeared to recognise. Contradictions. Immediate follow-up items.]

RECOMMENDED EXHIBIT

PRIMARY RECOMMENDATION: [Exhibit letter and name]
RATIONALE: [2-3 sentences.]

ALTERNATIVE: [Second Exhibit if applicable, and under what condition.]

NOT RECOMMENDED: [Exhibits clearly inappropriate at this stage, and why.]

PHASE 0 PREPARATION NOTES

[3-5 specific things John should investigate or verify in Phase 0.]

END OF PRE-BRIEF`;

/* ════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════ */
let history    = [];
let started    = false;
let isThinking = false;
let isDone     = false;

/* ════════════════════════════════════════════════════════
   DOM HELPERS
   ════════════════════════════════════════════════════════ */
const $msgs     = document.getElementById('msgs');
const $input    = document.getElementById('input');
const $sendBtn  = document.getElementById('send-btn');
const $badge    = document.getElementById('badge');
const $resetBtn = document.getElementById('reset-btn');

function setThinking(val) {
  isThinking = val;
  const existing = document.getElementById('thinking-row');
  if (val && !existing) {
    const el = document.createElement('div');
    el.id = 'thinking-row';
    el.style.cssText = 'display:flex;gap:20px;align-items:center;padding:20px 0;opacity:.55;';
    el.innerHTML = `
      <div style="font-family:'Cinzel',serif;font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#C9A961;width:78px;text-align:right;flex-shrink:0;">Interviewer</div>
      <div style="width:1px;background:rgba(201,169,97,0.2);height:22px;flex-shrink:0;"></div>
      <div style="display:flex;gap:6px;align-items:center;">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
    $msgs.appendChild(el);
  } else if (!val && existing) {
    existing.remove();
  }
  $input.disabled    = val || isDone || !started;
  $sendBtn.disabled  = val || isDone || !started || !$input.value.trim();
  scrollBottom();
}

function scrollBottom() {
  setTimeout(() => { $msgs.scrollTop = $msgs.scrollHeight; }, 30);
}

function appendMsg(type, text) {
  const label = type === 'iv' ? 'Interviewer' : type === 'pr' ? 'You' : 'Error';
  const el = document.createElement('div');
  el.className = `msg ${type}`;
  el.innerHTML = `
    <div class="msg-label">${label}</div>
    <div class="msg-line"></div>
    <div class="msg-text">${escHtml(text)}</div>`;
  $msgs.appendChild(el);
  scrollBottom();
}

function appendBrief(text) {
  const el = document.createElement('div');
  el.className = 'brief-wrap';
  el.innerHTML = `
    <div class="brief-hdr">
      <div class="brief-label">System</div>
      <div class="brief-line"></div>
      <div class="brief-title">Pre-Brief — Confidential</div>
    </div>
    <div class="brief-content">${escHtml(text)}</div>`;
  $msgs.appendChild(el);
  scrollBottom();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  $sendBtn.disabled = isThinking || isDone || !$input.value.trim();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

/* ════════════════════════════════════════════════════════
   API CALL
   ════════════════════════════════════════════════════════ */
async function callClaude(userMsg) {
  setThinking(true);

  const msgs = [...history, { role: 'user', content: userMsg }];
  history = msgs;

  try {
    const res = await fetch('https://www.legaisee.com/anthropic-proxy.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model:      'claude-sonnet-4-6',
        max_tokens: 1500,
        system:     SYSTEM_PROMPT,
        messages:   msgs
      })
    });

    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch(e) { throw new Error('JSON parse failed: ' + raw.slice(0, 200)); }

    if (!res.ok) {
      throw new Error(`API ${res.status}: ${data?.error?.message || raw.slice(0, 200)}`);
    }

    const reply = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('') || 'No response.';

    history = [...msgs, { role: 'assistant', content: reply }];
    setThinking(false);

    if (reply.includes('[BRIEF_COMPLETE]')) {
  const brief = reply.split('[BRIEF_COMPLETE]')[1].trim();
  appendBrief(brief);
  isDone = true;
  // Extract institution name from brief for filename
  const instMatch = brief.match(/INSTITUTION:\s*(.+)/);
  const institution = instMatch ? instMatch[1].trim() : 'Unknown';
  saveBrief(brief, history, institution);

  } catch(err) {
    setThinking(false);
    appendMsg('er', err.message);
  }
}

/* ════════════════════════════════════════════════════════
   CONTROLS
   ════════════════════════════════════════════════════════ */
async function start() {
  // Guard: API key not configured
  if (API_KEY === 'YOUR_API_KEY_HERE') {
    document.getElementById('splash').innerHTML = `
      <div class="sigil">◆</div>
      <div class="splash-label">API Key Required</div>
      <div class="splash-sub">Open <code style="font-style:normal;color:#C9A961;font-size:13px;">intake.html</code> and replace <code style="font-style:normal;color:#C9A961;font-size:13px;">YOUR_API_KEY_HERE</code> with your Anthropic API key. Save and reload.</div>`;
    return;
  }

  history = [];
  started = true;
  isDone  = false;

  // Clear splash, show reset
  $msgs.innerHTML = '';
  $resetBtn.style.display = 'block';

  await callClaude('Hello, I am here for the forensic intake.');
}

async function send() {
  const text = $input.value.trim();
  if (!text || isThinking || isDone) return;
  $input.value = '';
  $input.style.height = 'auto';
  $sendBtn.disabled = true;
  appendMsg('pr', text);
  await callClaude(text);
}

function reset() {
  history  = [];
  started  = false;
  isDone   = false;
  isThinking = false;

  $msgs.innerHTML = `
    <div id="splash">
      <div class="sigil">◆</div>
      <div class="splash-label">Phase 0 — Forensic Intake</div>
      <div class="splash-sub">A structured excavation of your institution's record. Begin when ready.</div>
      <button id="start-btn" onclick="start()">Begin Intake</button>
    </div>`;

  // Re-apply splash flex centering
  document.getElementById('splash').style.cssText =
    'display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;padding:48px;';

  $input.disabled   = true;
  $sendBtn.disabled = true;
  $input.value      = '';
  $input.style.height = 'auto';
  $badge.textContent  = 'Forensic Intake';
  $resetBtn.style.display = 'none';
}

/* ════════════════════════════════════════════════════════
   INPUT LIVE ENABLE
   ════════════════════════════════════════════════════════ */
$input.addEventListener('input', () => {
  if (!isThinking && !isDone && started) {
    $sendBtn.disabled = !$input.value.trim();
  }
});
/* ═══════════════════════════════════════════════════════════
   LEGAISEE — BRIEF SENDER
   Drop this function into BOTH Intaketest.html and registry.html
   Call it immediately after iBrief() / appendBrief() fires.
   ═══════════════════════════════════════════════════════════ */

async function saveBrief(brief, conversationHistory, institution) {

  /* Build readable transcript from history array */
  const transcript = conversationHistory
    .filter(m => m.role !== 'system')
    .map(m => (m.role === 'user' ? 'PRINCIPAL' : 'INTERVIEWER') + ':\n' + m.content)
    .join('\n\n' + '─'.repeat(40) + '\n\n');

  try {
    const res = await fetch('https://www.legaisee.com/save-brief.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        brief:        brief,
        conversation: transcript,
        institution:  institution || 'Unknown'
      })
    });
    const result = await res.json();
    console.log('Brief saved:', result);
  } catch(err) {
    console.error('Brief save failed:', err);
    /* Silent fail — user experience unaffected */
  }
}
</script>
