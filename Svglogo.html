<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGAiSEE — Rake Light Bevel System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0D0904;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', Georgia, serif;
    gap: 30px;
    padding: 20px;
    overflow-x: hidden;
  }
  
  .stage {
    position: relative;
    display: inline-block;
    border-radius: 20px;
    box-shadow: 
      0 0 80px rgba(201,169,97,0.12),
      0 0 160px rgba(201,169,97,0.05),
      inset 0 0 100px rgba(0,0,0,0.6);
    transition: box-shadow 0.5s ease;
  }
  
  .stage.raking {
    box-shadow: 
      0 0 100px rgba(245,232,192,0.2),
      0 0 200px rgba(201,169,97,0.1),
      inset 0 0 100px rgba(0,0,0,0.4);
  }
  
  /* === PATH GROUP BRIGHTNESS === */
  /* At rest — each group has its own base brightness */
  #logo-plate     { filter: brightness(1.0); }
  #logo-border    { filter: brightness(1.0); transition: filter 0.3s ease; }
  #logo-mark      { filter: brightness(1.0); transition: filter 0.3s ease; }
  #letter-depth   { filter: brightness(0.22); transition: filter 0.3s ease; }
  #letter-bevel-out { filter: brightness(0.6); transition: filter 0.3s ease; }
  #letter-face    { filter: brightness(1.0); transition: filter 0.3s ease; }
  #letter-bevel-in { filter: brightness(1.12); transition: filter 0.3s ease; }
  #letter-ridge   { filter: brightness(1.35); transition: filter 0.3s ease; }
  
  /* When rake is active — enhanced brightness per group */
  .stage.raking #logo-border    { filter: brightness(1.3) !important; }
  .stage.raking #logo-mark      { filter: brightness(1.4) !important; }
  .stage.raking #letter-depth   { filter: brightness(0.5) !important; }
  .stage.raking #letter-bevel-out { filter: brightness(1.0) !important; }
  .stage.raking #letter-face    { filter: brightness(1.3) !important; }
  .stage.raking #letter-bevel-in { filter: brightness(1.6) !important; }
  .stage.raking #letter-ridge   { filter: brightness(2.2) !important; }
  
  /* === RAKE LIGHT OVERLAY === */
  .rake-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: screen;
    opacity: 0;
    overflow: hidden;
    border-radius: 20px;
  }
  
  .rake-overlay.active {
    opacity: 1;
  }
  
  .rake-beam {
    position: absolute;
    top: -20%;
    left: -35%;
    width: 45%;
    height: 140%;
    background: radial-gradient(
      ellipse 55% 85% at 50% 50%,
      rgba(255,250,230,0.95) 0%,
      rgba(245,232,192,0.7) 18%,
      rgba(232,213,163,0.35) 45%,
      rgba(201,169,97,0.08) 72%,
      rgba(201,169,97,0) 100%
    );
    filter: blur(6px);
    transform: translateX(-100%);
  }
  
  .rake-overlay.active .rake-beam {
    animation: rakeSweep 1.6s cubic-bezier(0.35, 0, 0.25, 1) forwards;
  }
  
  @keyframes rakeSweep {
    0%   { transform: translateX(-50%); }
    100% { transform: translateX(450%); }
  }
  
  /* Controls */
  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .btn {
    background: linear-gradient(135deg, #5A4520, #7A6030, #C9A961, #D4B978, #C9A961, #7A6030, #5A4520);
    background-size: 300% 300%;
    background-position: 0% 50%;
    border: 1px solid #7A6030;
    padding: 12px 32px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #1A1208;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.4s ease;
    box-shadow: 0 4px 20px rgba(201,169,97,0.2);
    position: relative;
    overflow: hidden;
  }
  
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.5s ease;
  }
  
  .btn:hover {
    background-position: 100% 50%;
    box-shadow: 0 6px 30px rgba(201,169,97,0.4);
    transform: translateY(-2px);
  }
  
  .btn:hover::after {
    left: 100%;
  }
  
  .btn:active {
    transform: translateY(0);
  }
  
  .btn.on {
    border-color: #E8D5A3;
    box-shadow: 0 0 20px rgba(232,213,163,0.3);
  }
  
  .meta {
    text-align: center;
    color: #5A4520;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
  }
  
  .meta .divider {
    display: inline-block;
    width: 30px;
    height: 1px;
    background: #3A2A10;
    vertical-align: middle;
    margin: 0 12px;
  }
  
  /* Legend */
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 700px;
  }
  
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9px;
    color: #7A6030;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    border: 1px solid #3A2A10;
  }
  
  .legend-swatch.plate  { background: #1A1208; }
  .legend-swatch.border { background: #C9A961; }
  .legend-swatch.depth  { background: #2A1F08; }
  .legend-swatch.out    { background: #5A4520; }
  .legend-swatch.face   { background: #C9A961; }
  .legend-swatch.in     { background: #D4B978; }
  .legend-swatch.ridge  { background: #E8D5A3; }
  .legend-swatch.mark   { background: #7A6030; }
</style>
</head>

  <!-- Rake light overlay (HTML div for better performance) -->
  <div class="rake-overlay" id="rakeOverlay">
    <div class="rake-beam"></div>

</div>

<div class="controls">
  <button class="btn" onclick="triggerRake()">Trigger Rake</button>
  <button class="btn" onclick="toggleAuto()" id="autoBtn">Auto: OFF</button>
  <button class="btn" onclick="toggleLabels()" id="labelBtn">Labels</button>
</div>

<div class="meta">
  <span class="divider"></span>
  8-Path Bevel System
  <span class="divider"></span>
</div>

<div class="legend" id="legend" style="display:none;">
  <div class="legend-item"><div class="legend-swatch plate"></div> Plate</div>
  <div class="legend-item"><div class="legend-swatch border"></div> Border</div>
  <div class="legend-item"><div class="legend-swatch depth"></div> Depth</div>
  <div class="legend-item"><div class="legend-swatch out"></div> Bevel Out</div>
  <div class="legend-item"><div class="legend-swatch face"></div> Face</div>
  <div class="legend-item"><div class="legend-swatch in"></div> Bevel In</div>
  <div class="legend-item"><div class="legend-swatch ridge"></div> Ridge</div>
  <div class="legend-item"><div class="legend-swatch mark"></div> Mark</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const rakeOverlay = document.getElementById('rakeOverlay');
  const autoBtn = document.getElementById('autoBtn');
  const labelBtn = document.getElementById('labelBtn');
  const legend = document.getElementById('legend');
  let autoInterval = null;
  let isAuto = false;
  let labelsOn = false;
  
  function triggerRake() {
    rakeOverlay.classList.remove('active');
    stage.classList.remove('raking');
    void rakeOverlay.offsetWidth; // force reflow
    stage.classList.add('raking');
    rakeOverlay.classList.add('active');
    setTimeout(() => {
      rakeOverlay.classList.remove('active');
      stage.classList.remove('raking');
    }, 2000);
  }
  
  function toggleAuto() {
    isAuto = !isAuto;
    autoBtn.classList.toggle('on', isAuto);
    autoBtn.textContent = isAuto ? 'Auto: ON' : 'Auto: OFF';
    if (isAuto) {
      triggerRake();
      autoInterval = setInterval(triggerRake, 3200);
    } else {
      clearInterval(autoInterval);
      rakeOverlay.classList.remove('active');
      stage.classList.remove('raking');
    }
  }
