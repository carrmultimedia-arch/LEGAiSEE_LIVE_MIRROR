<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LVOS Lighting Lab</title>

  <link rel="stylesheet" href="../../assets/css/lvos-core.css">
  <link rel="stylesheet" href="../../assets/css/lvos-light-engine.css">
</head>

<body>

<header class="system-header">
  <div>LIGHT LAB</div>
  <div>SCROLL → LIGHT RESPONSE</div>
</header>

<section class="scene-container">

  <div class="material-stage">
    <div class="content-stack">

      <div class="light-meter">
        <div id="key">KEY</div>
        <div id="fill">FILL</div>
        <div id="ambient">AMBIENT</div>
      </div>

    </div>
  </div>

</section>

<script src="../../assets/js/lvos-light-engine.js"></script>
<script src="../../assets/js/lvos-loader.js"></script>

<script>
window.addEventListener("scroll", () => {

  const r = window.scrollY / (document.body.scrollHeight - window.innerHeight);

  const light = LVOS.Light;
  if (!light) return;

  light.labUpdate?.(r);

  document.getElementById("key").style.opacity = light.key.intensity;
  document.getElementById("fill").style.opacity = light.fill.intensity;
  document.getElementById("ambient").style.opacity = light.ambient.intensity;

});
</script>

</body>
</html>
